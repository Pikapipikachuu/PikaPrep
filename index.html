<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PikaPrep — NEET 2027 AI Study Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js for client-side PDF text & page rendering extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf9',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.55);
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .animate-pulse-ring {
      animation: pulseRing 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-teal-100 selection:text-teal-900 min-h-screen flex flex-col md:flex-row">

  <!-- Toast Notification Container (Replaces alert/confirm) -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h3 id="confirm-title" class="text-lg font-semibold text-slate-900 dark:text-white">Confirm Action</h3>
      <p id="confirm-message" class="text-sm text-slate-600 dark:text-slate-300 mt-2 leading-relaxed"></p>
      <div class="mt-6 flex justify-end gap-3">
        <button id="confirm-cancel-btn" class="px-4 py-2.5 text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition">Cancel</button>
        <button id="confirm-ok-btn" class="px-4 py-2.5 text-sm font-medium rounded-xl bg-rose-600 text-white hover:bg-rose-700 transition">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Desktop Sidebar Navigation -->
  <aside class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800 z-30">
    <div class="p-6 flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold shadow-xs">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">PikaPrep</span>
          <span class="block text-[11px] font-medium text-teal-600 dark:text-teal-400">NEET 2027 AI</span>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" id="desktop-nav">
      <button data-nav="home" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span>Home</span>
      </button>
      <button data-nav="analyze" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
        <i data-lucide="file-scan" class="w-4 h-4"></i>
        <span>Upload &amp; Analyze</span>
      </button>
      <button data-nav="qbank" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
        <i data-lucide="layers" class="w-4 h-4"></i>
        <span>Question Bank</span>
        <span id="nav-qbank-count" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">0</span>
      </button>
      <button data-nav="planner" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
        <i data-lucide="calendar-check" class="w-4 h-4"></i>
        <span>Study Planner</span>
      </button>
      <button data-nav="performance" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
        <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
        <span>Performance</span>
      </button>
      <button data-nav="saved" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
        <i data-lucide="bookmark" class="w-4 h-4"></i>
        <span>Saved &amp; Notes</span>
      </button>
    </nav>

    <div class="p-4 border-t border-slate-100 dark:border-slate-800 space-y-2">
      <button data-nav="settings" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
        <i data-lucide="settings" class="w-4 h-4"></i>
        <span>Settings &amp; API</span>
      </button>
      <div class="px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-teal-100 dark:bg-teal-900/60 text-teal-700 dark:text-teal-300 flex items-center justify-center font-semibold text-xs" id="sidebar-avatar">NA</div>
        <div class="min-w-0 flex-1">
          <p class="text-xs font-semibold truncate text-slate-800 dark:text-slate-200" id="sidebar-username">NEET Aspirant</p>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">Target: NEET 2027</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 md:pl-64 flex flex-col min-h-screen pb-20 md:pb-0">
    <!-- Top Header Bar -->
    <header class="sticky top-0 z-20 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200/70 dark:border-slate-800 px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 md:hidden">
        <div class="w-8 h-8 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-base text-slate-900 dark:text-white">PikaPrep</span>
      </div>

      <div class="hidden md:flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
        <span id="header-breadcrumb" class="font-medium text-slate-800 dark:text-slate-200">Home</span>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 ml-auto">
        <!-- Global Language Preference Selector -->
        <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl p-1 text-xs font-medium">
          <button onclick="setGlobalLanguage('bilingual')" id="lang-btn-bilingual" class="px-2.5 py-1 rounded-lg transition">EN + HI</button>
          <button onclick="setGlobalLanguage('en')" id="lang-btn-en" class="px-2.5 py-1 rounded-lg transition">EN</button>
          <button onclick="setGlobalLanguage('hi')" id="lang-btn-hi" class="px-2.5 py-1 rounded-lg transition">HI</button>
        </div>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" aria-label="Toggle Theme" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>

        <!-- Mobile Settings shortcut -->
        <button onclick="navigateTo('settings')" aria-label="Settings" class="md:hidden p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Dynamic View Container -->
    <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">
      <!-- Views are rendered cleanly into this container -->
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-2 py-1.5 flex justify-around items-center">
    <button data-nav="home" class="mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-medium transition">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span>Home</span>
    </button>
    <button data-nav="analyze" class="mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-medium transition">
      <i data-lucide="file-scan" class="w-5 h-5"></i>
      <span>Analyze</span>
    </button>
    <button data-nav="qbank" class="mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-medium transition">
      <i data-lucide="layers" class="w-5 h-5"></i>
      <span>Q-Bank</span>
    </button>
    <button data-nav="planner" class="mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-medium transition">
      <i data-lucide="calendar-check" class="w-5 h-5"></i>
      <span>Planner</span>
    </button>
    <button data-nav="performance" class="mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-medium transition">
      <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
      <span>Stats</span>
    </button>
    <button data-nav="saved" class="mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-medium transition">
      <i data-lucide="bookmark" class="w-5 h-5"></i>
      <span>Saved</span>
    </button>
  </nav>

  <!-- Question Detail Modal / Drawer -->
  <div id="question-modal" class="fixed inset-0 z-40 hidden bg-slate-900/50 backdrop-blur-xs overflow-y-auto">
    <div class="min-h-screen px-3 sm:px-6 py-6 flex items-start justify-center">
      <div id="question-modal-content" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-3xl w-full p-5 sm:p-7 shadow-2xl my-auto">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <script>
    // Configure PDF.js worker
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // =========================================================================
    // 1. STATE MANAGEMENT & PERSISTENCE LAYER
    // =========================================================================
    const STORAGE_KEY = 'pikaprep_neet2027_state_v1';

    const defaultState = {
      currentView: 'home',
      settings: {
        globalLanguage: 'bilingual', // 'bilingual' | 'en' | 'hi'
        theme: 'light',
        studentName: 'NEET 2027 Aspirant',
        targetScore: 680,
      },
      materials: [], // { id, name, size, type, uploadedAt, pageCount, extractedText, imageParts: [] }
      analysis: null, // { analyzedAt, summary, subjects: [ { name, chapters: [ { id, name, topics: [ { id, name, conceptSummary, isHighYield } ] } ] } ] }
      selection: {
        selectedChapterIds: [],
        selectedTopicIds: [],
      },
      generationConfig: {
        language: 'English + Hindi',
        coverage: 'Important + Expected',
        pattern: 'All NEET Patterns',
        questionCount: 6,
      },
      questions: [], // Stored generated questions
      attempts: {},  // { [questionId]: { selectedIndex, isCorrect, attemptedAt } }
      savedIds: [],  // Array of question IDs
      notes: {},     // { [questionId]: { text, updatedAt } }
      planner: {
        examDate: '2027-05-02',
        dailyHours: 6,
        availableDays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        priorities: { Biology: 'High', Chemistry: 'Medium', Physics: 'High' },
        tasks: [], // { id, date, subject, title, durationMins, completed, missedRescheduled }
      },
      activityLog: [], // { id, text, timestamp, type }
      qbankFilters: {
        subject: 'All',
        chapter: 'All',
        topic: 'All',
        pattern: 'All',
        priority: 'All',
        search: '',
        page: 1,
        pageSize: 10
      },
      savedFilterSubject: 'All',
      savedSearch: '',
      activeQuestionId: null,
      activeQuestionLang: null, // Per-question language override ('bilingual' | 'en' | 'hi')
    };

    let appState = loadState();

    // Transient session state (not persisted in localStorage due to binary size limits)
    let pendingUploadFiles = []; // Raw File objects ready for extraction & analysis
    let analysisWorkflowStep = 'upload'; // 'upload' | 'analyzing' | 'results' | 'configure'
    let analysisStageText = '';
    let isGeneratingQuestions = false;
    let generationStatusText = '';
    let expandedSubjects = {};
    let expandedChapters = {};
    let showAllChaptersMap = {};
    let showAllTopicsMap = {};

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(defaultState),
          ...parsed,
          settings: { ...defaultState.settings, ...(parsed.settings || {}) },
          selection: { ...defaultState.selection, ...(parsed.selection || {}) },
          generationConfig: { ...defaultState.generationConfig, ...(parsed.generationConfig || {}) },
          planner: { ...defaultState.planner, ...(parsed.planner || {}) },
          qbankFilters: { ...defaultState.qbankFilters, ...(parsed.qbankFilters || {}) },
        };
      } catch (e) {
        console.error('Failed to load state:', e);
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      try {
        // Persist everything except large raw base64 images if storage nears quota
        const stateToSave = {
          ...appState,
          materials: appState.materials.map(m => ({
            id: m.id,
            name: m.name,
            size: m.size,
            type: m.type,
            uploadedAt: m.uploadedAt,
            pageCount: m.pageCount,
            extractedText: (m.extractedText || '').slice(0, 45000), // Keep generous text context
          }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
      } catch (e) {
        showToast('Storage limit reached. Consider clearing older materials in Settings.', 'warning');
      }
      updateNavBadges();
    }

    function logActivity(text, type = 'info') {
      appState.activityLog.unshift({
        id: 'act_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        text,
        timestamp: new Date().toISOString(),
        type
      });
      appState.activityLog = appState.activityLog.slice(0, 20);
      saveState();
    }

    // =========================================================================
    // 2. UI UTILITIES (TOASTS, MODALS, THEME, LANGUAGE)
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        info: 'bg-slate-900 text-white border-slate-700 dark:bg-slate-800',
        success: 'bg-teal-700 text-white border-teal-600',
        warning: 'bg-amber-600 text-white border-amber-500',
        error: 'bg-rose-600 text-white border-rose-500',
      };
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button onclick="this.parentElement.remove()" class="opacity-75 hover:opacity-100 text-xs">✕</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4500);
    }

    function showConfirm(title, message, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const cancelBtn = document.getElementById('confirm-cancel-btn');
      const okBtn = document.getElementById('confirm-ok-btn');

      const cleanup = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      cancelBtn.onclick = cleanup;
      okBtn.onclick = () => {
        cleanup();
        onConfirm();
      };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDateRelative(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const diffMins = Math.floor((Date.now() - d.getTime()) / 60000);
      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHrs = Math.floor(diffMins / 60);
      if (diffHrs < 24) return `${diffHrs}h ago`;
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function applyTheme() {
      const isDark = appState.settings.theme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
    }

    function toggleTheme() {
      appState.settings.theme = appState.settings.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
    }

    function setGlobalLanguage(lang) {
      appState.settings.globalLanguage = lang;
      saveState();
      updateLanguageHeaderUI();
      renderCurrentView();
      if (appState.activeQuestionId) {
        appState.activeQuestionLang = lang;
        renderQuestionModal(appState.activeQuestionId);
      }
    }

    function updateLanguageHeaderUI() {
      ['bilingual', 'en', 'hi'].forEach(code => {
        const btn = document.getElementById(`lang-btn-${code}`);
        if (!btn) return;
        if (appState.settings.globalLanguage === code) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-xs transition';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition';
        }
      });
    }

    function updateNavBadges() {
      const badge = document.getElementById('nav-qbank-count');
      if (badge) badge.textContent = appState.questions.length;
      const usernameEl = document.getElementById('sidebar-username');
      const avatarEl = document.getElementById('sidebar-avatar');
      if (usernameEl) usernameEl.textContent = appState.settings.studentName || 'NEET Aspirant';
      if (avatarEl) {
        const initials = (appState.settings.studentName || 'NA').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        avatarEl.textContent = initials || 'NA';
      }
    }

    // =========================================================================
    // 3. NAVIGATION CONTROLLER
    // =========================================================================
    const viewTitles = {
      home: 'Home Dashboard',
      analyze: 'Upload & AI Material Analysis',
      qbank: 'Personalized Question Bank',
      planner: 'NEET 2027 Study Planner',
      performance: 'Performance & Revision Insights',
      saved: 'Saved Questions & Study Notes',
      settings: 'Settings & API Status',
    };

    function navigateTo(view) {
      appState.currentView = view;
      saveState();
      updateNavActiveState();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavActiveState() {
      const current = appState.currentView;
      document.getElementById('header-breadcrumb').textContent = viewTitles[current] || 'PikaPrep';

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === current) {
          btn.className = 'nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 transition';
        } else {
          btn.className = 'nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100/70 dark:hover:bg-slate-800/60 transition';
        }
      });

      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === current) {
          btn.className = 'mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-semibold text-teal-600 dark:text-teal-400 bg-teal-50/70 dark:bg-teal-950/50 transition';
        } else {
          btn.className = 'mobile-nav-btn flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-medium text-slate-500 dark:text-slate-400 transition';
        }
      });
    }

    // =========================================================================
    // 4. GEMINI AI CLIENT (WITH EXPONENTIAL BACKOFF & STRUCTURED JSON)
    // =========================================================================
    async function callGeminiAPI({ parts, systemInstruction, responseSchema, temperature = 0.25 }) {
      const url = "/api/gemini";
      const payload = {
        contents: [{ role: 'user', parts }],
        generationConfig: {
          temperature,
        }
      };

      if (systemInstruction) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
      }

      if (responseSchema) {
        payload.generationConfig.responseMimeType = 'application/json';
        payload.generationConfig.responseSchema = responseSchema;
      }

      const delays = [1000, 2000, 4000, 8000];
      let lastError = null;

      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errText = await response.text();
            throw new Error(`API HTTP ${response.status}: ${errText.slice(0, 180)}`);
          }

          const data = await response.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) {
            throw new Error('Empty response received from Gemini AI.');
          }
          return responseSchema ? JSON.parse(text) : text;
        } catch (err) {
          lastError = err;
          if (attempt < delays.length) {
            await new Promise(res => setTimeout(res, delays[attempt]));
          }
        }
      }
      throw lastError || new Error('Failed to communicate with AI service.');
    }

    // =========================================================================
    // 5. FILE EXTRACTION ENGINE (PDF.JS + IMAGE INLINE DATA + TEXT)
    // =========================================================================
    async function extractContentFromFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();

      // 1. Plain text / Markdown
      if (['txt', 'md', 'csv'].includes(ext) || file.type.startsWith('text/')) {
        const text = await file.text();
        return {
          name: file.name,
          size: file.size,
          type: file.type || 'text/plain',
          pageCount: 1,
          extractedText: text,
          imageParts: []
        };
      }

      // 2. Image files (JPG, JPEG, PNG, WEBP) - Passed directly to Gemini Vision/OCR
      if (['jpg', 'jpeg', 'png', 'webp'].includes(ext) || file.type.startsWith('image/')) {
        const base64 = await fileToBase64(file);
        return {
          name: file.name,
          size: file.size,
          type: file.type || 'image/jpeg',
          pageCount: 1,
          extractedText: `[Image Document: ${file.name}]`,
          imageParts: [{
            inlineData: {
              mimeType: file.type || 'image/jpeg',
              data: base64
            }
          }]
        };
      }

      // 3. PDF files - Extract page-by-page text; if scanned/handwritten (low text), render pages to JPEG for Gemini Vision OCR
      if (ext === 'pdf' || file.type === 'application/pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const maxPages = Math.min(pdf.numPages, 15); // Process up to 15 pages per PDF safely
        let combinedText = '';
        const imageParts = [];

        for (let p = 1; p <= maxPages; p++) {
          const page = await pdf.getPage(p);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ').trim();

          if (pageText.length > 40) {
            combinedText += `\n--- [File: ${file.name} | Page ${p}] ---\n${pageText}\n`;
          } else if (imageParts.length < 6) {
            // Likely a scanned or handwritten page -> Render page canvas for Gemini OCR
            const viewport = page.getViewport({ scale: 1.4 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport }).promise;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            const base64Data = dataUrl.split(',')[1];
            imageParts.push({
              inlineData: {
                mimeType: 'image/jpeg',
                data: base64Data
              }
            });
            combinedText += `\n--- [File: ${file.name} | Page ${p} (Scanned/Handwritten Page Image Attached)] ---\n`;
          }
        }

        return {
          name: file.name,
          size: file.size,
          type: 'application/pdf',
          pageCount: pdf.numPages,
          extractedText: combinedText.trim(),
          imageParts
        };
      }

      throw new Error(`Unsupported file format: ${file.name}`);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          resolve(result.split(',')[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

          <div class="flex items-center justify-end gap-3 pt-2">
            <button onclick="startMaterialAnalysis()"
                    ${pendingUploadFiles.length === 0 ? 'disabled' : ''}
                    class="px-6 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 transition ${pendingUploadFiles.length > 0 ? 'bg-teal-600 hover:bg-teal-700 text-white shadow-xs' : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}">
              <i data-lucide="sparkles" class="w-4 h-4"></i>
              <span>Analyze Material with AI</span>
            </button>
          </div>
        </div>
      `;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('border-teal-500', 'bg-teal-50/40');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('border-teal-500', 'bg-teal-50/40');
    }

    function handleFileDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('border-teal-500', 'bg-teal-50/40');
      if (e.dataTransfer?.files) {
        validateAndAddFiles(Array.from(e.dataTransfer.files));
      }
    }

    function handleFileInputChange(e) {
      if (e.target.files) {
        validateAndAddFiles(Array.from(e.target.files));
        e.target.value = '';
      }
    }

    function validateAndAddFiles(files) {
      const allowedExts = ['pdf', 'jpg', 'jpeg', 'png', 'webp', 'txt', 'md'];
      const maxFileSize = 15 * 1024 * 1024; // 15 MB
      const maxFiles = 8;

      for (const file of files) {
        if (pendingUploadFiles.length >= maxFiles) {
          showToast(`Maximum ${maxFiles} files allowed per batch.`, 'warning');
          break;
        }
        const ext = file.name.split('.').pop().toLowerCase();
        if (!allowedExts.includes(ext)) {
          showToast(`Unsupported file type: ${file.name}. Use PDF, JPG, PNG, or TXT.`, 'error');
          continue;
        }
        if (file.size > maxFileSize) {
          showToast(`File too large: ${file.name} exceeds 15 MB limit.`, 'error');
          continue;
        }
        if (file.size === 0) {
          showToast(`File is empty: ${file.name}.`, 'error');
          continue;
        }
        // Prevent duplicate filenames in queue
        if (!pendingUploadFiles.some(f => f.name === file.name && f.size === file.size)) {
          pendingUploadFiles.push(file);
        }
      }
      renderCurrentView();
    }

    function removePendingFile(index) {
      pendingUploadFiles.splice(index, 1);
      renderCurrentView();
    }

    function clearPendingFiles() {
      pendingUploadFiles = [];
      renderCurrentView();
    }

    function renderAnalyzingProgressState() {
      return `
        <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-8 sm:p-12 text-center max-w-xl mx-auto my-6 shadow-xs">
          <div class="w-16 h-16 rounded-full bg-teal-50 dark:bg-teal-950/70 text-teal-600 dark:text-teal-400 flex items-center justify-center mx-auto mb-5 animate-pulse-ring">
            <i data-lucide="brain-circuit" class="w-8 h-8"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Analyzing Your Study Material</h3>
          <p id="analysis-stage-label" class="text-sm font-medium text-teal-600 dark:text-teal-400 mt-2">${escapeHtml(analysisStageText)}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-3 leading-relaxed">
            Extracting text &amp; handwritten diagrams, identifying NEET Physics/Chemistry/Biology chapters, and mapping high-yield topics.
          </p>
        </div>
      `;
    }

    function updateAnalysisStage(text) {
      analysisStageText = text;
      const el = document.getElementById('analysis-stage-label');
      if (el) el.textContent = text;
    }

    async function startMaterialAnalysis() {
      if (pendingUploadFiles.length === 0) {
        showToast('Please select at least one study file first.', 'warning');
        return;
      }

      analysisWorkflowStep = 'analyzing';
      analysisStageText = 'Extracting content from uploaded files...';
      renderCurrentView();

      try {
        const extractedMaterials = [];
        for (let i = 0; i < pendingUploadFiles.length; i++) {
          const f = pendingUploadFiles[i];
          updateAnalysisStage(`Extracting content (${i + 1}/${pendingUploadFiles.length}): ${f.name}`);
          const extracted = await extractContentFromFile(f);
          extractedMaterials.push({
            id: 'mat_' + Date.now() + '_' + i,
            uploadedAt: new Date().toISOString(),
            ...extracted
          });
        }

        // Save extracted materials into state
        appState.materials = [...extractedMaterials, ...appState.materials].slice(0, 12);
        pendingUploadFiles = [];
        saveState();

        await runAIAnalysisOnMaterials(extractedMaterials);
      } catch (err) {
        console.error('Analysis error:', err);
        analysisWorkflowStep = 'upload';
        renderCurrentView();
        showToast(err.message || 'Failed to analyze uploaded material. Please try again.', 'error');
      }
    }

    async function reanalyzeStoredMaterials() {
      if (appState.materials.length === 0) return;
      analysisWorkflowStep = 'analyzing';
      analysisStageText = 'Preparing stored study material...';
      renderCurrentView();
      try {
        await runAIAnalysisOnMaterials(appState.materials);
      } catch (err) {
        analysisWorkflowStep = 'upload';
        renderCurrentView();
        showToast(err.message || 'Analysis failed.', 'error');
      }
    }

    async function runAIAnalysisOnMaterials(materialsList) {
      updateAnalysisStage('Identifying NEET subjects, chapters & high-yield topics...');

      const parts = [];
      let combinedCorpus = '';

      for (const mat of materialsList) {
        if (mat.extractedText) {
          combinedCorpus += `\n=== SOURCE FILE: ${mat.name} ===\n${mat.extractedText.slice(0, 22000)}\n`;
        }
        if (mat.imageParts && mat.imageParts.length > 0) {
          for (const imgPart of mat.imageParts.slice(0, 4)) {
            parts.push(imgPart);
          }
        }
      }

      const promptText = `
Analyze the attached NEET study material (text and/or handwritten/scanned page images).
Extract and organize the actual academic syllabus structure present in this material into:
1. Subjects (strictly classify under "Physics", "Chemistry", or "Biology" based on the content).
2. Chapters present in the material.
3. Specific Topics covered under each chapter, along with a concise concept summary grounded strictly in the uploaded material and whether it is a high-yield NEET exam area.

IMPORTANT RULES:
- Only detect subjects, chapters, and topics actually supported by the provided material. Do not invent unrelated chapters.
- If the image contains handwritten notes or diagrams, transcribe and interpret the scientific concepts accurately.
- Return structured JSON matching the schema.

STUDY MATERIAL TEXT:
${combinedCorpus || 'Refer to the attached handwritten/scanned document images.'}
      `.trim();

      parts.unshift({ text: promptText });

      const schema = {
        type: 'OBJECT',
        properties: {
          summary: { type: 'STRING' },
          subjects: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                name: { type: 'STRING' },
                chapters: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      name: { type: 'STRING' },
                      topics: {
                        type: 'ARRAY',
                        items: {
                          type: 'OBJECT',
                          properties: {
                            name: { type: 'STRING' },
                            conceptSummary: { type: 'STRING' },
                            isHighYield: { type: 'BOOLEAN' },
                            sourceFile: { type: 'STRING' }
                          },
                          required: ['name', 'conceptSummary', 'isHighYield']
                        }
                      }
                    },
                    required: ['name', 'topics']
                  }
                }
              },
              required: ['name', 'chapters']
            }
          }
        },
        required: ['summary', 'subjects']
      };

      updateAnalysisStage('Structuring chapters & topics...');
      const aiResult = await callGeminiAPI({
        parts,
        systemInstruction: 'You are an expert NEET-UG academic curriculum analyzer. Extract accurate subjects, chapters, and topics strictly from the student\'s uploaded notes.',
        responseSchema: schema,
        temperature: 0.2
      });

      // Assign deterministic unique IDs and select all by default
      const allChapterIds = [];
      const allTopicIds = [];

      const structuredSubjects = (aiResult.subjects || []).map((subj, sIdx) => ({
        id: `subj_${sIdx}_${Date.now()}`,
        name: subj.name,
        chapters: (subj.chapters || []).map((chap, cIdx) => {
          const chapId = `chap_${sIdx}_${cIdx}_${Date.now()}`;
          allChapterIds.push(chapId);
          return {
            id: chapId,
            name: chap.name,
            topics: (chap.topics || []).map((top, tIdx) => {
              const topId = `top_${sIdx}_${cIdx}_${tIdx}_${Date.now()}`;
              allTopicIds.push(topId);
              return {
                id: topId,
                name: top.name,
                conceptSummary: top.conceptSummary || '',
                isHighYield: Boolean(top.isHighYield),
                sourceFile: top.sourceFile || (materialsList[0]?.name || 'Uploaded Notes')
              };
            })
          };
        })
      }));

      if (structuredSubjects.length === 0) {
        throw new Error('Could not detect clear NEET chapters from the uploaded files. Please upload clearer notes.');
      }

      appState.analysis = {
        analyzedAt: new Date().toISOString(),
        summary: aiResult.summary || 'Analysis completed.',
        subjects: structuredSubjects
      };

      // Select all detected chapters and topics initially
      appState.selection.selectedChapterIds = allChapterIds;
      appState.selection.selectedTopicIds = allTopicIds;

      // Expand first subject by default
      expandedSubjects = { [structuredSubjects[0].id]: true };
      expandedChapters = {};
      if (structuredSubjects[0].chapters[0]) {
        expandedChapters[structuredSubjects[0].chapters[0].id] = true;
      }

      analysisWorkflowStep = 'results';
      logActivity(`Analyzed ${materialsList.length} file(s): detected ${allChapterIds.length} chapters & ${allTopicIds.length} topics.`);
      saveState();
      renderCurrentView();
      showToast('Material analysis complete!', 'success');
    }

    function toggleSubjectExpand(subjId) {
      expandedSubjects[subjId] = !expandedSubjects[subjId];

    function toggleChapterExpand(chapId) {
      expandedChapters[chapId] = !expandedChapters[chapId];
      renderCurrentView();
    }

    function toggleShowAllChapters(subjId) {
      showAllChaptersMap[subjId] = !showAllChaptersMap[subjId];
      renderCurrentView();
    }

    function toggleShowAllTopics(chapId) {
      showAllTopicsMap[chapId] = !showAllTopicsMap[chapId];
      renderCurrentView();
    }

    function toggleSelectAllTopics() {
      if (!appState.analysis) return;
      const allChapIds = [];
      const allTopIds = [];
      appState.analysis.subjects.forEach(s => {
        s.chapters.forEach(c => {
          allChapIds.push(c.id);
          c.topics.forEach(t => allTopIds.push(t.id));
        });
      });

      const isCurrentlyAll = appState.selection.selectedTopicIds.length === allTopIds.length;
      if (isCurrentlyAll) {
        appState.selection.selectedChapterIds = [];
        appState.selection.selectedTopicIds = [];
      } else {
        appState.selection.selectedChapterIds = allChapIds;
        appState.selection.selectedTopicIds = allTopIds;
      }
      saveState();
      renderCurrentView();
    }

    function toggleChapterSelection(chapId) {
      if (!appState.analysis) return;
      let targetChapter = null;
      for (const s of appState.analysis.subjects) {
        const found = s.chapters.find(c => c.id === chapId);
        if (found) { targetChapter = found; break; }
      }
      if (!targetChapter) return;

      const chapTopicIds = targetChapter.topics.map(t => t.id);
      const isSelected = appState.selection.selectedChapterIds.includes(chapId);

      if (isSelected) {
        appState.selection.selectedChapterIds = appState.selection.selectedChapterIds.filter(id => id !== chapId);
        appState.selection.selectedTopicIds = appState.selection.selectedTopicIds.filter(id => !chapTopicIds.includes(id));
      } else {
        appState.selection.selectedChapterIds.push(chapId);
        for (const tid of chapTopicIds) {
          if (!appState.selection.selectedTopicIds.includes(tid)) {
            appState.selection.selectedTopicIds.push(tid);
          }
        }
      }
      saveState();
      renderCurrentView();
    }

    function toggleTopicSelection(chapId, topicId) {
      if (!appState.analysis) return;
      const idx = appState.selection.selectedTopicIds.indexOf(topicId);
      if (idx > -1) {
        appState.selection.selectedTopicIds.splice(idx, 1);
      } else {
        appState.selection.selectedTopicIds.push(topicId);
      }

      // Sync parent chapter selection state
      let targetChapter = null;
      for (const s of appState.analysis.subjects) {
        const found = s.chapters.find(c => c.id === chapId);
        if (found) { targetChapter = found; break; }
      }
      if (targetChapter) {
        const anySelected = targetChapter.topics.some(t => appState.selection.selectedTopicIds.includes(t.id));
        const hasChap = appState.selection.selectedChapterIds.includes(chapId);
        if (anySelected && !hasChap) {
          appState.selection.selectedChapterIds.push(chapId);
        } else if (!anySelected && hasChap) {
          appState.selection.selectedChapterIds = appState.selection.selectedChapterIds.filter(id => id !== chapId);
        }
      }

      saveState();
      renderCurrentView();
    }

    function proceedToGenerationSettings() {
      if (appState.selection.selectedTopicIds.length === 0) {
        showToast('Select at least one topic before continuing.', 'warning');

      analysisWorkflowStep = 'configure';
      renderCurrentView();

    // =========================================================================

    // =========================================================================
    function getSelectedTopicsDetails() {
      if (!appState.analysis) return [];
      const selectedSet = new Set(appState.selection.selectedTopicIds);
      const list = [];
      for (const subj of appState.analysis.subjects) {
        for (const chap of subj.chapters) {
          for (const top of chap.topics) {
            if (selectedSet.has(top.id)) {
              list.push({
                subject: subj.name,
                chapter: chap.name,
                topic: top.name,
                conceptSummary: top.conceptSummary,
                isHighYield: top.isHighYield,
                sourceFile: top.sourceFile
              });
            }
          }
        }
      }
      return list;
    }

    function updateGenConfig(key, value) {
      appState.generationConfig[key] = value;
      saveState();

    function renderGeneratingProgressState() {
      return `
        <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-8 sm:p-12 text-center max-w-xl mx-auto my-6 shadow-xs">
          <div class="w-16 h-16 rounded-full bg-teal-50 dark:bg-teal-950/70 text-teal-600 dark:text-teal-400 flex items-center justify-center mx-auto mb-5 animate-pulse-ring">
            <i data-lucide="sparkles" class="w-8 h-8"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Crafting Personalized NEET Questions</h3>
          <p id="gen-stage-label" class="text-sm font-medium text-teal-600 dark:text-teal-400 mt-2">${escapeHtml(generationStatusText)}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-3 leading-relaxed">
            Generating scientifically accurate questions strictly from your selected chapters, complete with step-by-step explanations and source references.
          </p>
        </div>
      `;
    }

    async function generateNEETQuestions(singleTopicOverride = null) {
      const selectedTopics = singleTopicOverride ? [singleTopicOverride] : getSelectedTopicsDetails();
      if (selectedTopics.length === 0) {
        showToast('Please select at least one topic first.', 'warning');
        return;
      }

      const cfg = appState.generationConfig;
      const targetCount = singleTopicOverride ? 1 : (cfg.coverage === 'Important' ? 5 : cfg.coverage === 'Important + Expected' ? 7 : 9);

      isGeneratingQuestions = true;
      generationStatusText = `Generating ${targetCount} NEET-standard question(s) from ${selectedTopics.length} selected topic(s)...`;
      if (!singleTopicOverride) renderCurrentView();

      try {
        // Gather relevant source text excerpts
        const sourceContext = appState.materials
          .map(m => `[Source File: ${m.name}]\n${(m.extractedText || '').slice(0, 14000)}`)
          .join('\n\n')
          .slice(0, 28000);

        const existingStems = appState.questions.slice(0, 25).map(q => q.en?.question || '').join(' | ');

        const prompt = `
Generate ${targetCount} original, NEET-UG standard exam questions based STRICTLY on the student's selected topics and study material below.

SELECTED TOPICS (DO NOT generate questions outside these topics):
${JSON.stringify(selectedTopics, null, 2)}

GENERATION SETTINGS:
- Language Mode: ${cfg.language} (Always populate BOTH English ("en") and Hindi ("hi") fields accurately so the student can switch languages anytime without mixing languages).
- Coverage Depth: ${cfg.coverage}
- Allowed Question Pattern: ${cfg.pattern} (For "MCQ Only", set pattern to "MCQ". For "Assertion-Reason Only", set pattern to "Assertion-Reason" with Assertion (A) and Reason (R) in question text and standard 4 NEET A-R options. For "All NEET Patterns" or "MCQ + Assertion-Reason", include a balanced mix of "MCQ" and "Assertion-Reason").

AVOID DUPLICATING THESE EXISTING QUESTIONS:
${existingStems || 'None yet'}

SOURCE STUDY MATERIAL EXCERPTS:
${sourceContext || 'Use the verified concept summaries provided in the selected topics above.'}

STRICT SCIENTIFIC & NEET QUALITY RULES:
1. Every question must have 4 options (index 0, 1, 2, 3) with exact 1 correct answer ("correctIndex").
2. Preserve all chemical formulas, units, biological nomenclature, and mathematical symbols accurately.
3. For Hindi ("hi"), provide clean, natural, scientifically accurate Hindi translation (Devanagari script) using standard NTA NEET Hindi terminology. Never corrupt or mix English sentences inside Hindi fields except standard symbols/formulas.
4. Assign "priority" meaningfully as "High Yield", "Important", or "Expected" based on NEET weightage.
5. Provide "whyThisQuestion" explaining why NTA asks this concept in NEET.
6. Provide "sourceReference" citing the exact file name and topic from the material (never invent fake page numbers if not explicitly present).
        `.trim();

        const questionSchema = {
          type: 'OBJECT',
          properties: {
            questions: {
              type: 'ARRAY',
              items: {
                type: 'OBJECT',
                properties: {
                  subject: { type: 'STRING' },
                  chapter: { type: 'STRING' },
                  topic: { type: 'STRING' },
                  pattern: { type: 'STRING' },
                  difficulty: { type: 'STRING' },
                  priority: { type: 'STRING' },
                  sourceReference: { type: 'STRING' },
                  en: {
                    type: 'OBJECT',
                    properties: {
                      question: { type: 'STRING' },
                      options: { type: 'ARRAY', items: { type: 'STRING' } },
                      explanation: { type: 'STRING' },
                      whyThisQuestion: { type: 'STRING' }
                    },
                    required: ['question', 'options', 'explanation', 'whyThisQuestion']
                  },
                  hi: {
                    type: 'OBJECT',
                    properties: {
                      question: { type: 'STRING' },
                      options: { type: 'ARRAY', items: { type: 'STRING' } },
                      explanation: { type: 'STRING' },
                      whyThisQuestion: { type: 'STRING' }
                    },
                    required: ['question', 'options', 'explanation', 'whyThisQuestion']
                  },
                  correctIndex: { type: 'INTEGER' }
                },
                required: ['subject', 'chapter', 'topic', 'pattern', 'difficulty', 'priority', 'sourceReference', 'en', 'hi', 'correctIndex']
              }
            }
          },
          required: ['questions']
        };

        const result = await callGeminiAPI({
          parts: [{ text: prompt }],
          systemInstruction: 'You are a senior NTA NEET-UG question paper setter for Physics, Chemistry, and Biology. Generate accurate, conceptual, bilingual (English & Hindi) NEET questions grounded in the provided student notes.',
          responseSchema: questionSchema,
          temperature: 0.35
        });

        const generated = (result.questions || []).map((q, idx) => ({
          id: `q_${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`,
          subject: normalizeSubject(q.subject),
          chapter: q.chapter,
          topic: q.topic,
          pattern: q.pattern.includes('Assertion') ? 'Assertion-Reason' : 'MCQ',
          difficulty: q.difficulty || 'Moderate',
          priority: ['High Yield', 'Important', 'Expected'].includes(q.priority) ? q.priority : 'Important',
          sourceReference: q.sourceReference || 'Uploaded Study Material',
          en: {
            question: q.en.question,
            options: (q.en.options || []).slice(0, 4),
            explanation: q.en.explanation,
            whyThisQuestion: q.en.whyThisQuestion
          },
          hi: {
            question: q.hi.question,
            options: (q.hi.options || []).slice(0, 4),
            explanation: q.hi.explanation,
            whyThisQuestion: q.hi.whyThisQuestion
          },
          correctIndex: Math.min(3, Math.max(0, Number(q.correctIndex) || 0)),
          createdAt: new Date().toISOString()
        }));

        if (generated.length === 0) {
          throw new Error('AI did not return valid questions. Please retry.');
        }

        appState.questions = [...generated, ...appState.questions];
        isGeneratingQuestions = false;
        analysisWorkflowStep = 'results';
        logActivity(`Generated ${generated.length} new NEET question(s) from selected topics.`);
        saveState();

        if (singleTopicOverride) {
          showToast('Generated 1 fresh question on this topic!', 'success');
          openQuestionDetail(generated[0].id);
        } else {
          showToast(`Generated ${generated.length} personalized NEET questions!`, 'success');
          navigateTo('qbank');
        }
      } catch (err) {
        console.error('Generation failed:', err);
        isGeneratingQuestions = false;
        renderCurrentView();
        showToast(err.message || 'Question generation failed. Please check connection and retry.', 'error');
      }
    }

    function normalizeSubject(subj) {
      const s = (subj || '').toLowerCase();
      if (s.includes('phys')) return 'Physics';
      if (s.includes('chem')) return 'Chemistry';
      return 'Biology';
    }

    // =========================================================================
    // 9. VIEW 3: QUESTION BANK
    // =========================================================================
    function renderQBankView() {
      const f = appState.qbankFilters;
      const allQ = appState.questions;

      // Dynamic chapter & topic dropdown options based on current questions
      const chapters = ['All', ...new Set(allQ.filter(q => f.subject === 'All' || q.subject === f.subject).map(q => q.chapter))];
      const topics = ['All', ...new Set(allQ.filter(q => (f.subject === 'All' || q.subject === f.subject) && (f.chapter === 'All' || q.chapter === f.chapter)).map(q => q.topic))];

      // Filter questions
      const filtered = allQ.filter(q => {
        if (f.subject !== 'All' && q.subject !== f.subject) return false;
        if (f.chapter !== 'All' && q.chapter !== f.chapter) return false;
        if (f.topic !== 'All' && q.topic !== f.topic) return false;
        if (f.pattern !== 'All' && q.pattern !== f.pattern) return false;
        if (f.priority !== 'All' && q.priority !== f.priority) return false;
        if (f.search.trim()) {
          const term = f.search.toLowerCase();
          const matchEn = (q.en?.question || '').toLowerCase().includes(term);
          const matchHi = (q.hi?.question || '').toLowerCase().includes(term);
          const matchMeta = `${q.chapter} ${q.topic}`.toLowerCase().includes(term);
          if (!matchEn && !matchHi && !matchMeta) return false;
        }
        return true;
      });

      const totalPages = Math.max(1, Math.ceil(filtered.length / f.pageSize));
      if (f.page > totalPages) f.page = totalPages;

              <div>

                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Practice NEET-standard questions generated strictly from your study notes.</p>
              </div>
              <button onclick="navigateTo('analyze')" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs sm:text-sm font-semibold flex items-center gap-1.5 self-start sm:self-auto transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Generate More</span>
              </button>
            </div>

            <!-- Subject Pills -->
            <div class="flex flex-wrap items-center gap-2">
              ${['All', 'Biology', 'Chemistry', 'Physics'].map(sub => `
                <button onclick="updateQBankFilter('subject', '${sub}')"
                        class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition ${f.subject === sub ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70'}">
                  ${sub}
                </button>
              `).join('')}
            </div>

            <!-- Advanced Filter Row -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
              <div class="lg:col-span-2 relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text"
                       value="${escapeHtml(f.search)}"
                       oninput="updateQBankFilter('search', this.value)"
                       placeholder="Search questions, chapters, topics..."
                       class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm focus:outline-none focus:border-teal-500" />
              </div>

              <select onchange="updateQBankFilter('chapter', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm">
                ${chapters.map(c => `<option value="${escapeHtml(c)}" ${f.chapter === c ? 'selected' : ''}>${c === 'All' ? 'All Chapters' : escapeHtml(c)}</option>`).join('')}
              </select>

              <select onchange="updateQBankFilter('pattern', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm">
                <option value="All" ${f.pattern === 'All' ? 'selected' : ''}>All Patterns</option>
                <option value="MCQ" ${f.pattern === 'MCQ' ? 'selected' : ''}>MCQ</option>
                <option value="Assertion-Reason" ${f.pattern === 'Assertion-Reason' ? 'selected' : ''}>Assertion-Reason</option>
              </select>

              <select onchange="updateQBankFilter('priority', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm">
                <option value="All" ${f.priority === 'All' ? 'selected' : ''}>All Priorities</option>
                <option value="High Yield" ${f.priority === 'High Yield' ? 'selected' : ''}>High Yield</option>
                <option value="Important" ${f.priority === 'Important' ? 'selected' : ''}>Important</option>
                <option value="Expected" ${f.priority === 'Expected' ? 'selected' : ''}>Expected</option>
              </select>
            </div>
          </div>

          <!-- Questions List -->
          ${allQ.length === 0 ? `
            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-10 text-center">
              <i data-lucide="layers" class="w-10 h-10 text-slate-400 mx-auto mb-3"></i>
              <h3 class="text-base font-bold text-slate-900 dark:text-white">Your Question Bank is Empty</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-md mx-auto">
                Upload your study notes and select chapters to generate your first batch of NEET-standard questions.
              </p>
              <button onclick="navigateTo('analyze')" class="mt-4 px-5 py-2.5 rounded-xl bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700 transition">

        appState.qbankFilters.topic = 'All';
      }
      appState.qbankFilters.page = 1;
      saveState();
      renderCurrentView();
    }

    function resetQBankFilters() {
      appState.qbankFilters = {
        subject: 'All', chapter: 'All', topic: 'All', pattern: 'All', priority: 'All', search: '', page: 1, pageSize: 10
      };
      saveState();
      renderCurrentView();
    }

    function changeQBankPage(newPage) {
      appState.qbankFilters.page = newPage;
      saveState();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 10. QUESTION DETAIL MODAL EXPERIENCE (BILINGUAL, SINGLE ATTEMPT, NOTES)
    // =========================================================================
    let pendingSelectedOption = null;

    function openQuestionDetail(questionId) {
      const q = appState.questions.find(item => item.id === questionId);
      if (!q) return;
      appState.activeQuestionId = questionId;
      appState.activeQuestionLang = appState.settings.globalLanguage;
      const existingAttempt = appState.attempts[questionId];
      pendingSelectedOption = existingAttempt ? existingAttempt.selectedIndex : null;

      const modal = document.getElementById('question-modal');
      modal.classList.remove('hidden');
      renderQuestionModal(questionId);
    }

    function closeQuestionModal() {
      appState.activeQuestionId = null;
      pendingSelectedOption = null;
      document.getElementById('question-modal').classList.add('hidden');
      renderCurrentView();
    }

    function switchIndividualQuestionLang(lang) {
      // Preserves pendingSelectedOption and does NOT alter attempt count!
      appState.activeQuestionLang = lang;
      if (appState.activeQuestionId) {
        renderQuestionModal(appState.activeQuestionId);
      }
    }

    function selectQuestionOption(index) {
      const qId = appState.activeQuestionId;
      if (!qId || appState.attempts[qId]) return; // Locked once submitted
      pendingSelectedOption = index;
      renderQuestionModal(qId);
    }

    function submitQuestionAnswer() {
      const qId = appState.activeQuestionId;
      const q = appState.questions.find(item => item.id === qId);
      if (!q || pendingSelectedOption === null) {
        showToast('Please select an option before submitting.', 'warning');
        return;
      }
      // Record attempt only once
      if (!appState.attempts[qId]) {
        const isCorrect = pendingSelectedOption === q.correctIndex;
        appState.attempts[qId] = {
          selectedIndex: pendingSelectedOption,
          isCorrect,
          attemptedAt: new Date().toISOString()
        };
        logActivity(`Solved ${q.subject} (${q.topic}): ${isCorrect ? 'Correct' : 'Incorrect'}`);
        saveState();
      }
      renderQuestionModal(qId);
    }

    function toggleSaveQuestion(questionId) {
      const idx = appState.savedIds.indexOf(questionId);
      if (idx > -1) {
        appState.savedIds.splice(idx, 1);
        showToast('Removed from Saved Questions.', 'info');
      } else {
        appState.savedIds.push(questionId);
        showToast('Saved question for revision!', 'success');
      }
      saveState();
      if (appState.activeQuestionId === questionId) {
        renderQuestionModal(questionId);
      } else {
        renderCurrentView();
      }
    }

    function savePersonalNoteForQuestion(questionId) {
      const textarea = document.getElementById('modal-note-input');
      if (!textarea) return;
      const text = textarea.value.trim();
      if (!text) {
        delete appState.notes[questionId];
        showToast('Note cleared.', 'info');
      } else {
        appState.notes[questionId] = {
          text,
          updatedAt: new Date().toISOString()
        };
        showToast('Study note saved!', 'success');
      }
      saveState();
      renderQuestionModal(questionId);
    }

    function renderQuestionModal(questionId) {
      const q = appState.questions.find(item => item.id === questionId);
      if (!q) return;

      const lang = appState.activeQuestionLang || appState.settings.globalLanguage;
      const attempt = appState.attempts[questionId];
      const isSubmitted = Boolean(attempt);
      const selectedIdx = isSubmitted ? attempt.selectedIndex : pendingSelectedOption;
      const isSaved = appState.savedIds.includes(questionId);
      const existingNote = appState.notes[questionId]?.text || '';
      const optionLabels = ['A', 'B', 'C', 'D'];

      const container = document.getElementById('question-modal-content');
      container.innerHTML = `
        <div class="space-y-5">
          <!-- Top Meta & Close -->
          <div class="flex items-start justify-between gap-3 border-b border-slate-100 dark:border-slate-800 pb-4">
            <div class="space-y-1.5">
              <div class="flex flex-wrap items-center gap-1.5 text-xs font-semibold">
                <span class="px-2.5 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">${escapeHtml(q.subject)}</span>
                <span class="px-2.5 py-0.5 rounded-lg bg-teal-50 dark:bg-teal-950 text-teal-700 dark:text-teal-300">${escapeHtml(q.chapter)}</span>
                <span class="px-2.5 py-0.5 rounded-lg bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300">${escapeHtml(q.priority)}</span>
                <span class="px-2.5 py-0.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500">${escapeHtml(q.pattern)}</span>
              </div>
              <p class="text-xs text-slate-500 dark:text-slate-400">Topic: <strong class="text-slate-700 dark:text-slate-300">${escapeHtml(q.topic)}</strong></p>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <!-- Per-Question Language Switch -->
              <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl p-1 text-xs font-medium">
                <button onclick="switchIndividualQuestionLang('bilingual')" class="px-2 py-1 rounded-lg ${lang === 'bilingual' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-2xs' : 'text-slate-500'}">EN+HI</button>
                <button onclick="switchIndividualQuestionLang('en')" class="px-2 py-1 rounded-lg ${lang === 'en' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-2xs' : 'text-slate-500'}">EN</button>
                <button onclick="switchIndividualQuestionLang('hi')" class="px-2 py-1 rounded-lg ${lang === 'hi' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-2xs' : 'text-slate-500'}">HI</button>
              </div>

              <button onclick="closeQuestionModal()" aria-label="Close" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-500">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Question Stem -->
          <div class="space-y-2.5">
            ${lang !== 'hi' ? `
              <p class="text-base sm:text-lg font-semibold text-slate-900 dark:text-white leading-relaxed whitespace-pre-line">${escapeHtml(q.en.question)}</p>
            ` : ''}
            ${lang !== 'en' ? `
              <p class="text-base sm:text-lg font-medium ${lang === 'bilingual' ? 'text-slate-600 dark:text-slate-300 pt-2 border-t border-dashed border-slate-200 dark:border-slate-800' : 'text-slate-900 dark:text-white'} leading-relaxed whitespace-pre-line">${escapeHtml(q.hi.question)}</p>
            ` : ''}
          </div>

          <!-- Answer Options -->
          <div class="space-y-2.5">
            ${[0, 1, 2, 3].map(idx => {
              const enOpt = q.en.options[idx] || '';
              const hiOpt = q.hi.options[idx] || '';
              let cardClass = 'border-slate-200 dark:border-slate-700 hover:border-teal-400 bg-white dark:bg-slate-900';

              if (!isSubmitted && selectedIdx === idx) {
                cardClass = 'border-teal-600 bg-teal-50/70 dark:bg-teal-950/50 ring-1 ring-teal-600';
              } else if (isSubmitted) {
                if (idx === q.correctIndex) {
                  cardClass = 'border-emerald-500 bg-emerald-50/80 dark:bg-emerald-950/50 ring-1 ring-emerald-500';
                } else if (idx === selectedIdx && idx !== q.correctIndex) {
                  cardClass = 'border-rose-500 bg-rose-50/80 dark:bg-rose-950/50 ring-1 ring-rose-500';
                } else {
                  cardClass = 'border-slate-200/70 dark:border-slate-800 opacity-70';
                }
              }

              return `
                <button type="button"
                        ${isSubmitted ? 'disabled' : ''}
                        onclick="selectQuestionOption(${idx})"
                        class="w-full p-3.5 sm:p-4 rounded-xl border text-left flex items-start gap-3 transition ${cardClass}">
                  <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${isSubmitted && idx === q.correctIndex ? 'bg-emerald-600 text-white' : isSubmitted && idx === selectedIdx ? 'bg-rose-600 text-white' : selectedIdx === idx ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}">
                    ${optionLabels[idx]}
                  </span>
                  <div class="flex-1 text-sm leading-relaxed">
                    ${lang !== 'hi' ? `<div class="font-medium text-slate-800 dark:text-slate-100">${escapeHtml(enOpt)}</div>` : ''}
                    ${lang !== 'en' ? `<div class="${lang === 'bilingual' ? 'text-xs text-slate-500 dark:text-slate-400 mt-0.5' : 'font-medium text-slate-800 dark:text-slate-100'}">${escapeHtml(hiOpt)}</div>` : ''}

                </button>
              `;
            }).join('')}
          </div>

          <!-- Submit Button (Before Submission) -->
          ${!isSubmitted ? `
            <div class="flex justify-end pt-1">
              <button onclick="submitQuestionAnswer()" class="px-6 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold shadow-xs transition">
                Submit Answer
              </button>
            </div>
          ` : `
            <!-- Feedback & Detailed Explanation (After Submission) -->
            <div class="space-y-4 pt-2">
              <div class="p-4 rounded-xl border ${attempt.isCorrect ? 'bg-emerald-50/70 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800' : 'bg-rose-50/70 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800'}">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-bold ${attempt.isCorrect ? 'text-emerald-800 dark:text-emerald-300' : 'text-rose-800 dark:text-rose-300'}">

                </div>
              </div>

              <!-- Detailed Explanation -->
              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700 space-y-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Detailed Explanation</h4>
                ${lang !== 'hi' ? `<p class="text-sm text-slate-800 dark:text-slate-200 leading-relaxed whitespace-pre-line">${escapeHtml(q.en.explanation)}</p>` : ''}
                ${lang !== 'en' ? `<p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line ${lang === 'bilingual' ? 'pt-2 border-t border-slate-200 dark:border-slate-700' : ''}">${escapeHtml(q.hi.explanation)}</p>` : ''}
              </div>

              <!-- Why This Question & Source Reference -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="p-3.5 rounded-xl bg-amber-50/50 dark:bg-amber-950/30 border border-amber-200/60 dark:border-amber-800/50">
                  <span class="text-xs font-bold text-amber-800 dark:text-amber-300 block mb-1">Why this question?</span>
                  <p class="text-xs text-slate-700 dark:text-slate-300 leading-relaxed">
                    ${escapeHtml(lang === 'hi' ? q.hi.whyThisQuestion : q.en.whyThisQuestion)}
                  </p>
                </div>
                <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200/60 dark:border-slate-700">
                  <span class="text-xs font-bold text-slate-700 dark:text-slate-300 block mb-1">Source Reference</span>
                  <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                    ${escapeHtml(q.sourceReference)}
                  </p>
                </div>
              </div>
            </div>
          `}

          <!-- Personal Study Note Section -->
          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
              <i data-lucide="pen-line" class="w-3.5 h-3.5 text-teal-600"></i>
              <span>Personal Revision Note</span>
            </label>
            <div class="flex flex-col sm:flex-row gap-2">
              <textarea id="modal-note-input" rows="2" placeholder="Write a quick memory trick, formula, or NCERT line for this question..." class="flex-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm focus:outline-none focus:border-teal-500">${escapeHtml(existingNote)}</textarea>
              <button onclick="savePersonalNoteForQuestion('${q.id}')" class="px-4 py-2 rounded-xl bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white text-xs font-semibold shrink-0 self-end sm:self-stretch transition">
                Save Note
              </button>
            </div>
          </div>

          <!-- Footer Actions: Save Question & Make Another Question -->
          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
            <button onclick="toggleSaveQuestion('${q.id}')" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-semibold flex items-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition ${isSaved ? 'text-amber-600 border-amber-300 bg-amber-50/50 dark:bg-amber-950/30' : 'text-slate-700 dark:text-slate-300'}">
              <i data-lucide="bookmark" class="w-4 h-4 ${isSaved ? 'fill-current' : ''}"></i>
              <span>${isSaved ? 'Saved' : 'Save Question'}</span>
            </button>

            <button onclick="generateAnotherFromQuestion('${q.id}')" class="px-4 py-2 rounded-xl bg-teal-50 dark:bg-teal-950/70 text-teal-700 dark:text-teal-300 border border-teal-200 dark:border-teal-800 text-xs sm:text-sm font-semibold flex items-center gap-2 hover:bg-teal-100 transition">
              <i data-lucide="sparkles" class="w-4 h-4"></i>
              <span>Make Another Question</span>
            </button>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function generateAnotherFromQuestion(questionId) {
      const q = appState.questions.find(item => item.id === questionId);
      if (!q) return;
      showToast('Generating another NEET question on this topic...', 'info');
      generateNEETQuestions({
        subject: q.subject,
        chapter: q.chapter,
        topic: q.topic,
        conceptSummary: q.en.explanation,
        isHighYield: q.priority === 'High Yield',
        sourceFile: q.sourceReference
      });
    }

    // =========================================================================
    // 11. VIEW 4: STUDY PLANNER
    // =========================================================================
    function renderPlannerView() {
      const pl = appState.planner;
      const examDateObj = new Date(pl.examDate + 'T09:00:00');
      const daysRemaining = Math.max(0, Math.ceil((examDateObj - new Date()) / (1000 * 60 * 60 * 24)));
      const weeklyHours = pl.dailyHours * pl.availableDays.length;

      const todayStr = new Date().toISOString().split('T')[0];
      const missedTasks = pl.tasks.filter(t => !t.completed && t.date < todayStr);
      const todaysTasks = pl.tasks.filter(t => t.date === todayStr);
      const upcomingTasks = pl.tasks.filter(t => t.date > todayStr);
      const completedCount = pl.tasks.filter(t => t.completed).length;
      const overallPct = pl.tasks.length > 0 ? Math.round((completedCount / pl.tasks.length) * 100) : 0;

      return `
        <div class="space-y-6">
          <!-- Top Overview Stats -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4">

              <p class="text-2xl font-bold text-slate-900 dark:text-white mt-1">${daysRemaining}</p>

            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4">
              <span class="text-xs text-slate-500">Weekly Study Hours</span>
              <p class="text-2xl font-bold text-slate-900 dark:text-white mt-1">${weeklyHours} hrs</p>

              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Target NEET Exam Date</label>

                       class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />

              <div>

                ${['Biology', 'Chemistry', 'Physics'].map(sub => `
                  <div class="flex items-center justify-between text-xs">

              <button onclick="generateSmartStudySchedule()" class="w-full py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition">
                <i data-lucide="wand-2" class="w-4 h-4"></i>
                <span>Generate Smart Schedule</span>
              </button>
            </div>

            <!-- Tasks List & Add Custom Task -->
            <div class="lg:col-span-2 space-y-5">
              <!-- Quick Add Task -->
              <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 sm:p-5">
                <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-3">Add Study Task</h3>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
                  <select id="new-task-subject" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm">
                    <option value="Biology">Biology</option>
                    <option value="Chemistry">Chemistry</option>

                  <input type="text" id="new-task-title" placeholder="Chapter / Topic to revise..." class="sm:col-span-2 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm" />
                  <button onclick="addCustomPlannerTask()" class="px-4 py-2 rounded-xl bg-slate-800 dark:bg-slate-700 text-white text-xs sm:text-sm font-semibold hover:bg-slate-900 transition">

                <div class="flex items-center justify-between">
                  <h3 class="text-base font-bold text-slate-900 dark:text-white">Today's Tasks (${todaysTasks.length})</h3>
                  <span class="text-xs text-slate-400">${todayStr}</span>
                </div>
                ${todaysTasks.length === 0 ? `
                  <p class="text-xs sm:text-sm text-slate-500 py-4 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-xl">

                  </p>
                ` : `
                  <div class="space-y-2">
                    ${todaysTasks.map(t => renderPlannerTaskRow(t)).join('')}

              ${upcomingTasks.length > 0 ? `
                <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 space-y-3">
                  <h3 class="text-base font-bold text-slate-900 dark:text-white">Upcoming Schedule (${upcomingTasks.length})</h3>
                  <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    ${upcomingTasks.map(t => renderPlannerTaskRow(t, true)).join('')}
                  </div>
                </div>

    function addCustomPlannerTask() {

      if (!title) {
        showToast('Enter a task title first.', 'warning');
        return;
      }
      const todayStr = new Date().toISOString().split('T')[0];
      appState.planner.tasks.unshift({

    function togglePlannerTask(taskId) {
      const task = appState.planner.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.completed = !task.completed;
      if (task.completed) {
        logActivity(`Completed study task: ${task.title}`);

      saveState();
      renderCurrentView();

    function deletePlannerTask(taskId) {
      appState.planner.tasks = appState.planner.tasks.filter(t => t.id !== taskId);

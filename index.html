      renderCurrentView();

    function rescheduleMissedTasks() {
      const todayStr = new Date().toISOString().split('T')[0];
      let count = 0;
      appState.planner.tasks.forEach((t, idx) => {
        if (!t.completed && t.date < todayStr) {
          const offsetDays = Math.floor(count / 2); // Spread 2 missed tasks per day
          const newDate = new Date();
          newDate.setDate(newDate.getDate() + offsetDays);
          t.date = newDate.toISOString().split('T')[0];
          count++;
        }
      });
      saveState();
      renderCurrentView();
      showToast(`Rescheduled ${count} missed task(s) starting today.`, 'success');
    }

    function generateSmartStudySchedule() {
      // Build realistic tasks from analyzed chapters/topics + core NEET subjects weighted by priorities
      const weightMap = { High: 3, Medium: 2, Low: 1 };
      const pool = [];

      if (appState.analysis && appState.analysis.subjects) {
        appState.analysis.subjects.forEach(s => {
          const subjNorm = normalizeSubject(s.name);
          const w = weightMap[appState.planner.priorities[subjNorm]] || 2;
          s.chapters.forEach(c => {
            for (let i = 0; i < w; i++) {
              pool.push({
                subject: subjNorm,
                title: `${c.name}: Concept Review & Practice (${c.topics.length} topics)`
              });
            }
          });
        });
      }

      if (pool.length === 0) {
        // Fallback structured NEET revision blocks if no notes uploaded yet
        const defaults = [
          { subject: 'Biology', title: 'NCERT Human Physiology — Line-by-Line Revision & MCQs' },
          { subject: 'Physics', title: 'Electrostatics & Current Electricity — Formula & Numerical Drill' },
          { subject: 'Chemistry', title: 'Organic Chemistry Reaction Mechanisms — Named Reactions Practice' },
          { subject: 'Biology', title: 'Genetics & Molecular Basis of Inheritance — Assertion-Reason Set' },
          { subject: 'Chemistry', title: 'Chemical Bonding & Coordination Compounds — High-Yield Review' },
          { subject: 'Physics', title: 'Ray Optics & Modern Physics — PYQ & Concept Practice' }
        ];
        pool.push(...defaults);
      }

      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const tasksPerDay = Math.max(1, Math.min(4, Math.floor(appState.planner.dailyHours / 1.5)));
      const newTasks = [];
      let poolIdx = 0;

      // Schedule next 7 available study days
      for (let dayOffset = 0; dayOffset < 10 && newTasks.length < 14; dayOffset++) {
        const d = new Date();
        d.setDate(d.getDate() + dayOffset);
        const dayName = dayNames[d.getDay()];
        if (!appState.planner.availableDays.includes(dayName)) continue;

        const dateStr = d.toISOString().split('T')[0];
        for (let slot = 0; slot < tasksPerDay; slot++) {
          const item = pool[poolIdx % pool.length];
          poolIdx++;
          newTasks.push({
            id: `plan_${Date.now()}_${dayOffset}_${slot}`,
            date: dateStr,
            subject: item.subject,
            title: item.title,
            durationMins: Math.round((appState.planner.dailyHours * 60) / tasksPerDay),
            completed: false
          });
        }
      }

      // Keep completed tasks and replace pending auto-generated schedule
      const completedExisting = appState.planner.tasks.filter(t => t.completed);
      appState.planner.tasks = [...completedExisting, ...newTasks];
      logActivity(`Generated a smart ${newTasks.length}-task NEET study schedule.`);
      saveState();
      renderCurrentView();
      showToast(`Scheduled ${newTasks.length} study sessions across your available days!`, 'success');
    }

    function renderPerformanceView() {
      const attemptIds = Object.keys(appState.attempts);

      let correctCount = 0;
      let incorrectCount = 0;

      const subjectStats = {
        Biology: { attempted: 0, correct: 0 },
        Chemistry: { attempted: 0, correct: 0 },
        Physics: { attempted: 0, correct: 0 }

      const patternStats = {

        'Assertion-Reason': { attempted: 0, correct: 0 }
      };

      const chapterStats = {};

      attemptIds.forEach(qId => {
        const att = appState.attempts[qId];
        const q = appState.questions.find(item => item.id === qId);
        if (!q) return;

        if (att.isCorrect) correctCount++;
        else incorrectCount++;

        const sub = normalizeSubject(q.subject);
        subjectStats[sub].attempted++;
        if (att.isCorrect) subjectStats[sub].correct++;

        const pat = q.pattern === 'Assertion-Reason' ? 'Assertion-Reason' : 'MCQ';
        patternStats[pat].attempted++;
        if (att.isCorrect) patternStats[pat].correct++;

        if (!chapterStats[q.chapter]) {
          chapterStats[q.chapter] = { subject: sub, attempted: 0, correct: 0 };
        }
        chapterStats[q.chapter].attempted++;
        if (att.isCorrect) chapterStats[q.chapter].correct++;
      });

      const accuracy = totalAttempted > 0 ? Math.round((correctCount / totalAttempted) * 100) : 0;
      const netNeetScore = (correctCount * 4) - (incorrectCount * 1);

      // Identify weak chapters (< 65% accuracy)
      const chapterEntries = Object.entries(chapterStats).map(([name, st]) => ({
        name,
        subject: st.subject,
        attempted: st.attempted,
        correct: st.correct,
        accuracy: Math.round((st.correct / st.attempted) * 100)

            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 sm:p-5">
              <span class="text-xs text-slate-500">Weak Chapters Flagged</span>

              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Global Language Preference</label>
                <select onchange="setGlobalLanguage(this.value)" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                  <option value="bilingual" ${appState.settings.globalLanguage === 'bilingual' ? 'selected' : ''}>English + Hindi (Bilingual)</option>
                  <option value="en" ${appState.settings.globalLanguage === 'en' ? 'selected' : ''}>English Only</option>
                  <option value="hi" ${appState.settings.globalLanguage === 'hi' ? 'selected' : ''}>Hindi Only</option>
                </select>
              </div>
            </div>

            <div class="flex items-center justify-between pt-2">
              <div>
                <p class="text-sm font-semibold text-slate-800 dark:text-slate-200">Appearance Theme</p>
                <p class="text-xs text-slate-500">Switch between soft daylight and dark study mode</p>
              </div>
              <button onclick="toggleTheme()" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                Current: ${appState.settings.theme === 'dark' ? 'Dark Mode' : 'Light Mode'}
              </button>
            </div>
          </div>

          <!-- AI Engine & Security Status -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 space-y-4 shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-lg font-bold text-slate-900 dark:text-white">AI Engine &amp; API Status</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  Powered by Gemini 3 Flash • API credentials are securely managed by the runtime environment (never exposed in client storage).
                </p>
              </div>
              <button onclick="testGeminiConnection()" id="test-api-btn" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs sm:text-sm font-semibold shrink-0 transition">
                Test AI Connection
              </button>
            </div>

            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700 flex items-center justify-between text-xs sm:text-sm">
              <span class="font-medium text-slate-600 dark:text-slate-300">Connection Status:</span>
              <span id="api-status-badge" class="font-semibold text-teal-600 dark:text-teal-400">${escapeHtml(apiConnectionStatus)}</span>
            </div>
          </div>

          <!-- Data Management -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 space-y-4 shadow-xs">
            <h2 class="text-lg font-bold text-slate-900 dark:text-white">Data Management</h2>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
              Your uploaded material summaries, generated questions, attempts, notes, and study schedule are saved locally on this device.
            </p>
            <div class="flex flex-wrap gap-3">
              <button onclick="exportUserDataJSON()" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                Export Backup (JSON)
              </button>
              <button onclick="confirmResetAllData()" class="px-4 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800 text-xs sm:text-sm font-semibold hover:bg-rose-100 transition">
                Clear All Application Data
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function updateStudentName(name) {
      appState.settings.studentName = name.trim() || 'NEET 2027 Aspirant';
      saveState();
      showToast('Profile name updated.', 'success');
    }

    async function testGeminiConnection() {
      const btn = document.getElementById('test-api-btn');
      const badge = document.getElementById('api-status-badge');
      if (btn) btn.disabled = true;
      if (badge) badge.textContent = 'Testing connection...';

      try {
        const res = await callGeminiAPI({
          parts: [{ text: 'Reply with exactly: Connected' }],
          temperature: 0
        });
        apiConnectionStatus = `Connected (${res.trim().slice(0, 20)})`;
        if (badge) badge.textContent = apiConnectionStatus;
        showToast('AI service connection verified!', 'success');
      } catch (err) {
        apiConnectionStatus = 'Unavailable — Check network/API runtime';
        if (badge) badge.textContent = apiConnectionStatus;
        showToast('AI connection test failed: ' + err.message, 'error');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function exportUserDataJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `PikaPrep_NEET2027_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON downloaded.', 'success');
    }

    function confirmResetAllData() {
      showConfirm(
        'Reset All PikaPrep Data?',
        'This will permanently delete your uploaded material metadata, generated questions, solved history, notes, and study schedule.',
        () => {
          localStorage.removeItem(STORAGE_KEY);
          appState = structuredClone(defaultState);
          pendingUploadFiles = [];
          analysisWorkflowStep = 'upload';
          saveState();
          applyTheme();
          updateLanguageHeaderUI();
          navigateTo('home');
          showToast('All application data cleared.', 'info');
        }
      );
    }

    // =========================================================================
    // 15. MAIN VIEW ROUTER & INITIALIZATION
    // =========================================================================
    function renderCurrentView() {
      const main = document.getElementById('app-main');
      if (!main) return;

      let html = '';
      switch (appState.currentView) {
        case 'home':
          html = renderHomeView();
          break;
        case 'analyze':
          html = renderAnalyzeView();
          break;
        case 'qbank':
          html = renderQBankView();
          break;
        case 'planner':
          html = renderPlannerView();
          break;
        case 'performance':
          html = renderPerformanceView();
          break;
        case 'saved':
          html = renderSavedView();
          break;
        case 'settings':
          html = renderSettingsView();
          break;
        default:
          html = renderHomeView();
      }

      main.innerHTML = html;
      lucide.createIcons();
    }

    window.onload = function () {
      // Bind desktop & mobile navigation buttons
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-nav');
          if (target) navigateTo(target);
        });
      });

      applyTheme();
      updateLanguageHeaderUI();
      updateNavBadges();
      updateNavActiveState();
      renderCurrentView();
    };
  </script>
</body>
</html>
